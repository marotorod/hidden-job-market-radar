# Fuentes de señales que anticipan contrataciones
fuentes:
  - nombre: Crunchbase
    tipo: api
    url: https://api.crunchbase.com/v3.1/organizations/{slug}/funding_rounds
    campos: [announced_on, investment_type, money_raised]
    palabras_clave: ["funding", "investment", "series"]
  - nombre: Layoffs.fyi
    tipo: api
    url: https://layoffs.fyi/api/v2/layoffs?company={slug}
    campos: [date, location, numbers]
    palabras_clave: ["layoff", "downsizing", "restructuring"]
  - nombre: Newsletter sectorial
    tipo: rss
    url: https://example.com/sector/rss
    palabras_clave: ["expansion", "new office", "hiring plan"]